# keyd — evdev-level key remapping.
#
# This is the canonical copy. keyd only reads /etc/keyd/default.conf, which is
# outside chezmoi's $HOME scope, so run_onchange_install-keyd-config.sh copies
# it into place whenever this file changes.

[ids]
*

[main]

# Caps Lock: Control when held, Escape when tapped.
# Remapping at the evdev layer (rather than via xkb) means this also works in
# a TTY and in any compositor, and the tap/hold distinction is something xkb
# cannot express at all.
capslock = overload(control, esc)
