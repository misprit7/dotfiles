# PipeWire starts at boot (linger), before anyone has logged in. Its stock realtime
# setup first asks for nice -11; that is not permitted, so it hands the whole job to
# RTKit, and RTKit refuses anything outside an active login session. The daemon then
# runs without realtime priority for the entire uptime and audio drops out whenever
# the machine is busy.
#
# Skip the nice request (20 means "leave nice alone") so PipeWire takes realtime
# priority directly from the account's rtprio limit instead. On oko that limit comes
# from /etc/security/limits.d/99-airhockey.conf (rtprio 50). Priority 20 is what RTKit
# would have given, and stays below the air hockey control loop (SCHED_FIFO 40).
# Where there is no rtprio limit this changes nothing: RTKit is still the fallback.
module.rt.args = {
    nice.level = 20
    rt.prio    = 20
}
