# tmux configuration (managed by chezmoi)

### Terminal capabilities ###

# Pass kitty keyboard protocol through to applications (fixes Esc delay in neovim)
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux-256color:extkeys'

# Near-zero delay after ESC — critical for Neovim. Safe because kitty keyboard
# protocol (above) makes Alt keys arrive as unique CSI sequences, not ESC+key.
set -sg escape-time 1

# True color (24-bit) support - required for Neovim colorschemes
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",wezterm:RGB"

### Appearance ###

# Highlight active pane border
set -g pane-border-lines heavy
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour75,bold

### Mouse ###

# Mouse support: click to focus pane/window, drag borders to resize, wheel to scroll.
# (Hold Shift while dragging for a normal terminal text selection.)
set -g mouse on

### Session management ###

# Ctrl+b k — kill current session (prompts for confirmation)
bind-key k confirm-before -p "Kill this session? (y/n)" "kill-session"

# Alt+w — open window/session tree (like Ctrl+b w)
bind-key -n M-w choose-tree -Zw

### Pane navigation ###

# Alt+hjkl — move between panes; at left/right edge, switch window instead (no wrap)
# At top/bottom edge, no-op (no wrap).
# Note: under sway/i3 the WM claims Alt+hjkl for window focus, so these only take
# effect outside the WM. The Alt+arrow binds below are the ones that work there.
bind-key -n M-h if-shell -F "#{pane_at_left}" \
  "run-shell 'first=$(tmux list-windows -F \"##I\" | sort -n | head -1); [ \"#I\" != \"\$first\" ] && tmux previous-window || true'" \
  "select-pane -L"
bind-key -n M-j if-shell -F "#{pane_at_bottom}" "" "select-pane -D"
bind-key -n M-k if-shell -F "#{pane_at_top}"    "" "select-pane -U"
bind-key -n M-l if-shell -F "#{pane_at_right}" \
  "run-shell 'last=$(tmux list-windows -F \"##I\" | sort -n | tail -1); [ \"#I\" != \"\$last\" ] && tmux next-window || true'" \
  "select-pane -R"

# Alt+Arrow — move between panes by direction (no prefix). Used because the WM
# claims Alt+hjkl; the WM leaves Alt+arrows free.
# Guarded with pane_at_* so at an edge they do nothing instead of wrapping around.
bind-key -n M-Up    if-shell -F "#{pane_at_top}"    "" "select-pane -U"
bind-key -n M-Down  if-shell -F "#{pane_at_bottom}" "" "select-pane -D"
bind-key -n M-Left  if-shell -F "#{pane_at_left}"   "" "select-pane -L"
bind-key -n M-Right if-shell -F "#{pane_at_right}"  "" "select-pane -R"

### Pane arrangement ###

# Alt+Shift+hjkl — split in direction (no prefix needed)
bind-key -n M-H split-window -h -b
bind-key -n M-J split-window -v
bind-key -n M-K split-window -v -b
bind-key -n M-L split-window -h

# Alt+Shift+Arrow — MOVE the current pane in that direction (mirrors the nav binds
# above; like sway's $mod+Shift+hjkl). -d keeps focus on the moved pane, and the
# same pane_at_* guard makes it a no-op at the edge (no wrap).
bind-key -n M-S-Up    if-shell -F "#{pane_at_top}"    "" "swap-pane -d -t '{up-of}'"
bind-key -n M-S-Down  if-shell -F "#{pane_at_bottom}" "" "swap-pane -d -t '{down-of}'"
bind-key -n M-S-Left  if-shell -F "#{pane_at_left}"   "" "swap-pane -d -t '{left-of}'"
bind-key -n M-S-Right if-shell -F "#{pane_at_right}"  "" "swap-pane -d -t '{right-of}'"
